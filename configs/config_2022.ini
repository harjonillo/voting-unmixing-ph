[DEFAULT]
; paths are relative to the repo root
data_path = data/elections
processed_path = data/processed/2022
shapefile_path = data/shapefiles
log_level = INFO

[elections]
senatorial_votes_file = 2022_senators_complete.csv

[preprocessing]
; comma-separated region codes excluded from the analysis
excluded_regions = OV, LAV
; index of the first senatorial-candidate column in the complete/filtered CSVs
sen_col_start = 17
; candidate kept only if its 25th percentile of per-precinct votes >= this
min_candidate_25th_percentile = 10
; precinct kept only if its total votes over the kept candidates >= this
min_precinct_votes = 10
; how each precinct's candidate votes are normalized:
;   valid_ballots — divide by information.numberOfValidBallot (vote share per ballot)
;   row_max       — divide by the precinct's top candidate votes
;   none          — raw counts
normalization = valid_ballots

[unmixing]
; 0 means: use the HySime estimate kf
n_archetypes = 6
mvsa_mm_iters = 10
sunsal_al_iters = 1000
sunsal_tol = 1e-4
seed = 42

[sweep]
; endmember counts to compare (inclusive range)
p_min = 2
p_max = 7
n_trials = 50
base_seed = 0
; joblib workers for the trial loop
n_jobs = 4

[geo]
region_shapefile = regions/Regions.shp
province_shapefile = provinces/Provinces.shp
; downloaded municipal boundaries (optional; app falls back gracefully if absent)
municipality_file = municipalities.geojson
