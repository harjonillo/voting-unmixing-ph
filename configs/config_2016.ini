[DEFAULT]
; paths are relative to the repo root
data_path = data/elections
processed_path = data/processed/2016
shapefile_path = data/shapefiles
log_level = INFO

[elections]
senatorial_votes_file = 2016_senators_complete.csv

[preprocessing]
; comma-separated region codes excluded from the analysis
excluded_regions = OV, LAV
; index of the first senatorial-candidate column in the 2016 complete CSV
; (REGION, PROVINCE, CITY_MUNICIPALITY, BARANGAY, CLUSTERED_PRECINCT,
;  information.numberOfRegisteredVoters, then 50 candidates)
sen_col_start = 6
; candidate kept only if its 25th percentile of per-precinct votes >= this
min_candidate_25th_percentile = 10
; precinct kept only if its total votes over the kept candidates >= this
min_precinct_votes = 10
; how each precinct's candidate votes are normalized (units: notebook 14). Any
; script's --normalization flag overrides this; vote_sum runs are written to a
; vote_sum/ subfolder of processed_path, per-ballot runs to processed_path itself.
;   valid_ballots — divide by information.numberOfValidBallot
;                   (loadings votes/ballot; abundance = share of ballots)
;   actual_voters — divide by information.numberOfActuallyVoters (same units)
;   vote_sum      — divide by the precinct's total votes for the kept candidates
;                   (loadings votes/vote; abundance = share of votes)
;   row_max       — divide by the precinct's top candidate votes (not an exact
;                   linear mixing model; kept only to reproduce old runs)
;   none          — raw counts
; 2016 uses vote_sum (as 2013 does): the transmission feed has no ballot
; count, and its only size proxy (col 7, ~registered voters) is unverified.
; (It used row_max until 2026-11-09; see notebook 14.)
normalization = vote_sum

[unmixing]
; 4 matches 2013 and keeps the cross-year loadings sanity check comparable.
; The 2013-style stability sweep that would independently justify p is not
; available for 2016 (it aggregates by municipality, and this source has no
; geography); revisit if a precinct->location lookup is found.
n_archetypes = 4
mvsa_mm_iters = 10
sunsal_al_iters = 1000
sunsal_tol = 1e-4
seed = 42
; NMF endmember extraction (--method nmf; notebook 10). init = random makes each
; run seed-dependent (the deterministic nndsvd ignores the seed).
nmf_init = random
nmf_beta_loss = kullback-leibler
nmf_solver = mu
nmf_max_iter = 1000
nmf_tol = 1e-4

[sweep]
; endmember counts to compare (inclusive range)
p_min = 2
p_max = 7
n_trials = 50
base_seed = 0
; joblib workers for the trial loop
n_jobs = 4

[geo]
region_shapefile = regions/Regions.shp
province_shapefile = provinces/Provinces.shp
; downloaded municipal boundaries (optional; app falls back gracefully if absent)
municipality_file = municipalities.geojson
